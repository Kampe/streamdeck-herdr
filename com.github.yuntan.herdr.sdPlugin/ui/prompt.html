<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Send Prompt</title>
    <script src="lib/sdpi-components.js"></script>
    <script src="lib/toggle.js"></script>
  </head>
  <body>
    <sdpi-item label="Prompt">
      <sdpi-textarea
        setting="text"
        rows="4"
        maxlength="500"
        showlength
        placeholder="Example: Run the tests and report the result"
      ></sdpi-textarea>
    </sdpi-item>

    <sdpi-item label="Target">
      <sdpi-select id="binding" setting="binding" default="focused">
        <option value="focused">Focused agent</option>
        <option value="index">Agent position</option>
        <option value="session">Pinned agent</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item id="row-index" label="Position" hidden>
      <sdpi-range
        setting="index"
        value-type="number"
        min="1"
        max="8"
        step="1"
        default="1"
        showlabels
      ></sdpi-range>
    </sdpi-item>

    <sdpi-item id="row-session" label="Agent" hidden>
      <sdpi-select
        setting="sessionId"
        datasource="getAgents"
        loading="Loading…"
        placeholder="Select an agent"
        show-refresh
        hot-reload
      ></sdpi-select>
    </sdpi-item>

    <sdpi-item label="Button label">
      <sdpi-textfield setting="label" maxlength="12" placeholder="Prompt"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Socket path">
      <sdpi-textfield
        setting="socketPath"
        global
        placeholder="~/.config/herdr/herdr.sock"
      ></sdpi-textfield>
    </sdpi-item>

    <script>
      bindToggle("binding", { "row-index": ["index"], "row-session": ["session"] });
    </script>
  </body>
</html>
