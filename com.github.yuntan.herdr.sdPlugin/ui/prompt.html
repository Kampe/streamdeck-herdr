<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>__MSG_sendPrompt__</title>
    <script src="lib/sdpi-components.js"></script>
    <script src="lib/i18n.js"></script>
    <script src="lib/toggle.js"></script>
  </head>
  <body>
    <sdpi-item label="__MSG_macro__">
      <sdpi-select id="macro" setting="macro" default="custom">
        <option value="continue">Continue</option>
        <option value="review">Review diff</option>
        <option value="tests">Run tests</option>
        <option value="explain">Explain blocker</option>
        <option value="stop">Stop safely</option>
        <option value="custom">Custom</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item id="row-text" label="__MSG_prompt__">
      <sdpi-textarea
        setting="text"
        rows="4"
        maxlength="500"
        showlength
        placeholder="__MSG_examplePrompt__"
      ></sdpi-textarea>
    </sdpi-item>

    <sdpi-item label="__MSG_target__">
      <sdpi-select id="binding" setting="binding" default="focused">
        <option value="focused">__MSG_focusedAgent__</option>
        <option value="index">__MSG_agentPosition__</option>
        <option value="session">__MSG_pinnedAgent__</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item id="row-index" label="__MSG_position__" hidden>
      <sdpi-range
        setting="index"
        value-type="number"
        min="1"
        max="8"
        step="1"
        default="1"
        showlabels
      ></sdpi-range>
    </sdpi-item>

    <sdpi-item id="row-session" label="__MSG_agent__" hidden>
      <sdpi-select
        setting="sessionId"
        datasource="getAgents"
        loading="__MSG_loading__"
        placeholder="__MSG_selectAgent__"
        show-refresh
        hot-reload
      ></sdpi-select>
    </sdpi-item>

    <sdpi-item label="__MSG_buttonLabel__">
      <sdpi-textfield setting="label" maxlength="12" placeholder="__MSG_prompt__"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="__MSG_socketPath__">
      <sdpi-textfield
        setting="socketPath"
        global
        placeholder="~/.config/herdr/herdr.sock"
      ></sdpi-textfield>
    </sdpi-item>

    <script>
      bindToggle("macro", { "row-text": ["custom"] });
      bindToggle("binding", { "row-index": ["index"], "row-session": ["session"] });
    </script>
  </body>
</html>
