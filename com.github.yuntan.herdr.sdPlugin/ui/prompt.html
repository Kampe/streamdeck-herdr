<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>プロンプト送信</title>
    <script src="lib/sdpi-components.js"></script>
    <script src="lib/toggle.js"></script>
  </head>
  <body>
    <sdpi-item label="プロンプト">
      <sdpi-textarea
        setting="text"
        rows="4"
        maxlength="500"
        showlength
        placeholder="例: テストを実行して結果を教えて"
      ></sdpi-textarea>
    </sdpi-item>

    <sdpi-item label="対象">
      <sdpi-select id="binding" setting="binding" default="focused">
        <option value="focused">フォーカス中のエージェント</option>
        <option value="index">順番で指定</option>
        <option value="session">エージェントを固定</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item id="row-index" label="順番" hidden>
      <sdpi-range
        setting="index"
        value-type="number"
        min="1"
        max="8"
        step="1"
        default="1"
        showlabels
      ></sdpi-range>
    </sdpi-item>

    <sdpi-item id="row-session" label="エージェント" hidden>
      <sdpi-select
        setting="sessionId"
        datasource="getAgents"
        loading="読み込み中…"
        placeholder="エージェントを選択"
        show-refresh
        hot-reload
      ></sdpi-select>
    </sdpi-item>

    <sdpi-item label="キーの表示名">
      <sdpi-textfield setting="label" maxlength="12" placeholder="プロンプト"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="ソケットパス">
      <sdpi-textfield
        setting="socketPath"
        global
        placeholder="~/.config/herdr/herdr.sock"
      ></sdpi-textfield>
    </sdpi-item>

    <script>
      bindToggle("binding", { "row-index": ["index"], "row-session": ["session"] });
    </script>
  </body>
</html>
