<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>エージェント</title>
    <script src="lib/sdpi-components.js"></script>
    <script src="lib/toggle.js"></script>
  </head>
  <body>
    <sdpi-item label="割り当て">
      <sdpi-select id="binding" setting="binding" default="index">
        <option value="index">順番で指定</option>
        <option value="session">エージェントを固定</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item id="row-index" label="順番" hidden>
      <sdpi-range
        setting="index"
        value-type="number"
        min="1"
        max="8"
        step="1"
        default="1"
        showlabels
      ></sdpi-range>
    </sdpi-item>

    <sdpi-item id="row-session" label="エージェント" hidden>
      <sdpi-select
        setting="sessionId"
        datasource="getAgents"
        loading="読み込み中…"
        placeholder="エージェントを選択"
        show-refresh
        hot-reload
      ></sdpi-select>
    </sdpi-item>

    <sdpi-item label="ラベル">
      <sdpi-select id="labelSource" setting="labelSource" default="workspace">
        <option value="workspace">ワークスペース名</option>
        <option value="title">端末タイトル</option>
        <option value="custom">固定文字列</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item id="row-custom-label" label="固定文字列" hidden>
      <sdpi-textfield setting="customLabel" maxlength="24"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="ソケットパス">
      <sdpi-textfield
        setting="socketPath"
        global
        placeholder="~/.config/herdr/herdr.sock"
      ></sdpi-textfield>
    </sdpi-item>

    <script>
      bindToggle("binding", { "row-index": ["index"], "row-session": ["session"] });
      bindToggle("labelSource", { "row-custom-label": ["custom"] });
    </script>
  </body>
</html>
