<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agent</title>
    <script src="lib/sdpi-components.js"></script>
    <script src="lib/toggle.js"></script>
  </head>
  <body>
    <sdpi-item label="Assignment">
      <sdpi-select id="binding" setting="binding" default="index">
        <option value="index">Agent position</option>
        <option value="session">Pin an agent</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item id="row-index" label="Position" hidden>
      <sdpi-range
        setting="index"
        value-type="number"
        min="1"
        max="8"
        step="1"
        default="1"
        showlabels
      ></sdpi-range>
    </sdpi-item>

    <sdpi-item id="row-session" label="Agent" hidden>
      <sdpi-select
        setting="sessionId"
        datasource="getAgents"
        loading="Loading…"
        placeholder="Select an agent"
        show-refresh
        hot-reload
      ></sdpi-select>
    </sdpi-item>

    <sdpi-item label="Label">
      <sdpi-select id="labelSource" setting="labelSource" default="workspace">
        <option value="workspace">Workspace name</option>
        <option value="title">Terminal title</option>
        <option value="custom">Custom text</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item id="row-custom-label" label="Custom text" hidden>
      <sdpi-textfield setting="customLabel" maxlength="24"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Socket path">
      <sdpi-textfield
        setting="socketPath"
        global
        placeholder="~/.config/herdr/herdr.sock"
      ></sdpi-textfield>
    </sdpi-item>

    <script>
      bindToggle("binding", { "row-index": ["index"], "row-session": ["session"] });
      bindToggle("labelSource", { "row-custom-label": ["custom"] });
    </script>
  </body>
</html>
