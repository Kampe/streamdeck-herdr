<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>__MSG_agent__</title>
    <script src="lib/sdpi-components.js"></script>
    <script src="lib/i18n.js"></script>
    <script src="lib/toggle.js"></script>
  </head>
  <body>
    <sdpi-item label="__MSG_assignment__">
      <sdpi-select id="binding" setting="binding" default="index">
        <option value="index">__MSG_agentPosition__</option>
        <option value="session">__MSG_pinAgent__</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item id="row-index" label="__MSG_position__" hidden>
      <sdpi-range
        setting="index"
        value-type="number"
        min="1"
        max="8"
        step="1"
        default="1"
        showlabels
      ></sdpi-range>
    </sdpi-item>

    <sdpi-item id="row-session" label="__MSG_agent__" hidden>
      <sdpi-select
        setting="sessionId"
        datasource="getAgents"
        loading="__MSG_loading__"
        placeholder="__MSG_selectAgent__"
        show-refresh
        hot-reload
      ></sdpi-select>
    </sdpi-item>

    <sdpi-item label="__MSG_label__">
      <sdpi-select id="labelSource" setting="labelSource" default="workspace">
        <option value="workspace">__MSG_workspaceName__</option>
        <option value="title">__MSG_terminalTitle__</option>
        <option value="custom">__MSG_customText__</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item id="row-custom-label" label="__MSG_customText__" hidden>
      <sdpi-textfield setting="customLabel" maxlength="24"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="__MSG_socketPath__">
      <sdpi-textfield
        setting="socketPath"
        global
        placeholder="~/.config/herdr/herdr.sock"
      ></sdpi-textfield>
    </sdpi-item>

    <script>
      bindToggle("binding", { "row-index": ["index"], "row-session": ["session"] });
      bindToggle("labelSource", { "row-custom-label": ["custom"] });
    </script>
  </body>
</html>
